name: Response template fixtures

# The parity fixtures of smg-response-template are recorded from transformers;
# fail when they no longer match what the pinned release returns.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/response_template/scripts/**'
      - 'crates/response_template/tests/fixtures/hf/**'
      - '.github/workflows/response-template-fixtures.yml'
  workflow_dispatch:

concurrency:
  group: response-template-fixtures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Fixtures match transformers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned transformers
        run: python -m pip install -r crates/response_template/scripts/requirements.txt

      # transformers' tests are not in the wheel; the generator checks that the
      # installed chat_parsing sources equal the tag's.
      - name: Check out transformers v5.17.0 (tests and chat_parsing only)
        run: |
          git clone --depth 1 --branch v5.17.0 --filter=blob:none --sparse \
            https://github.com/huggingface/transformers "$RUNNER_TEMP/transformers"
          git -C "$RUNNER_TEMP/transformers" sparse-checkout set \
            tests/utils src/transformers/utils/chat_parsing

      - name: Regenerate and compare
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python crates/response_template/scripts/generate_hf_fixtures.py \
            --transformers-src "$RUNNER_TEMP/transformers" --check
